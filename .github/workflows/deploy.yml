name: Deploy Theme to Xserver

on:
  push:
    branches:
      - master # masterブランチの場合は master に変更

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /haru-coding.com/public_html/wp-content/hamburger-shop/wp-content/themes/hamburger-wp/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
